<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companies — OpportuNet Cameroon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header {
      background: var(--dark-800);
      padding: 48px 28px 40px;
      border-bottom: 1px solid var(--dark-700);
    }
    .page-header-inner {
      max-width: 1120px;
      margin: 0 auto;
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 700;
      color: var(--white); letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .page-header p {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }

    .companies-layout {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 28px;
    }

    .companies-search {
      display: flex; gap: 12px;
      margin-bottom: 32px; flex-wrap: wrap;
    }
    .companies-search input {
      flex: 1; min-width: 200px;
      padding: 10px 16px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      font-size: 14px; font-family: var(--font-body);
      color: var(--dark-900);
    }
    .companies-search input:focus {
      outline: none; border-color: var(--green-400);
    }
    .companies-search select {
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      font-size: 13px; font-family: var(--font-body);
      color: var(--dark-700); background: var(--white);
    }

    .companies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .company-card {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .company-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--green-700);
      transform: scaleX(0);
      transform-origin: left;
      transition: var(--transition);
    }
    .company-card:hover {
      border-color: var(--green-400);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    .company-card:hover::before { transform: scaleX(1); }

    .company-card-top {
      display: flex; gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .company-logo {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--green-700);
      display: flex; align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700; font-size: 18px;
      color: var(--white); flex-shrink: 0;
    }
    .company-name {
      font-family: var(--font-display);
      font-size: 16px; font-weight: 700;
      color: var(--dark-900); margin-bottom: 4px;
    }
    .company-type {
      font-size: 12px; color: var(--green-700);
      font-weight: 500;
    }
    .company-desc {
      font-size: 13px; color: #555;
      line-height: 1.7; font-weight: 300;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .company-meta {
      display: flex; gap: 10px;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--gray-200);
    }
    .company-meta-item {
      font-size: 11px; color: #888;
      display: flex; align-items: center; gap: 4px;
    }
    .company-listings-count {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      color: var(--green-700);
      background: var(--green-50);
      border: 1px solid var(--green-200);
      padding: 3px 10px; border-radius: 20px;
      margin-top: 10px;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--white);
      border-radius: var(--radius-xl);
      width: 100%; max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-header {
      background: var(--dark-800);
      padding: 28px 32px;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%;
      color: var(--white); font-size: 16px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .modal-close:hover { background: rgba(255,255,255,0.2); }
    .modal-logo {
      width: 64px; height: 64px;
      border-radius: var(--radius-md);
      background: var(--green-700);
      display: flex; align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700; font-size: 22px;
      color: var(--white); margin-bottom: 14px;
    }
    .modal-name {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      color: var(--white); margin-bottom: 4px;
    }
    .modal-type {
      font-size: 13px; color: var(--green-400);
    }
    .modal-body { padding: 28px 32px; }
    .modal-section { margin-bottom: 24px; }
    .modal-section-title {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 600;
      color: var(--dark-900);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-200);
    }
    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .modal-info-item {}
    .modal-info-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .modal-info-value { font-size: 13px; font-weight: 500; color: var(--dark-900); }
    .modal-desc {
      font-size: 14px; color: #444;
      line-height: 1.8; font-weight: 300;
    }
    .modal-listings { display: flex; flex-direction: column; gap: 10px; }
    .modal-listing-item {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 14px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      cursor: pointer; transition: var(--transition);
    }
    .modal-listing-item:hover { background: var(--green-50); }
    .modal-listing-title {
      font-size: 13px; font-weight: 500; color: var(--dark-900);
    }
    .modal-listing-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .btn-visit {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green-700); color: var(--white);
      font-size: 13px; font-weight: 500;
      padding: 10px 20px; border-radius: var(--radius-md);
      border: none; cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-body);
      margin-top: 16px;
    }
    .btn-visit:hover { background: var(--green-600); }

    .results-info {
      font-size: 14px; color: #888;
      margin-bottom: 20px;
    }
    .results-info strong { color: var(--dark-900); }

    @media (max-width: 600px) {
      .companies-grid { grid-template-columns: 1fr; }
      .modal-info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══ NAVBAR ═══════════════════════════ -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">
        <span class="logo-name">OpportuNet</span>
        <span class="logo-country">Cameroon</span>
      </div>
    </a>
    <div class="navbar-links">
      <a href="index.html"         class="nav-link">Home</a>
      <a href="opportunities.html" class="nav-link">Opportunities</a>
      <a href="companies.html"     class="nav-link active">Companies</a>
      <a href="people.html"        class="nav-link">People</a>
      <a href="map.html"           class="nav-link">Map</a>
      <a href="about.html"         class="nav-link">About</a>
    </div>
    <div class="navbar-actions" id="navbar-actions"></div>
  </nav>

  <!-- ═══ PAGE HEADER ══════════════════════ -->
  <div class="page-header">
    <div class="page-header-inner">
      <h1>Companies & Organizations</h1>
      <p>Browse all organizations posting opportunities on OpportuNet Cameroon</p>
    </div>
  </div>

  <!-- ═══ MAIN CONTENT ═════════════════════ -->
  <div class="companies-layout">

    <div class="companies-search">
      <input type="text" id="company-search"
        placeholder="🔍  Search companies..." />
      <select id="company-sector">
        <option value="">All Sectors</option>
        <option value="Technology">Technology</option>
        <option value="Finance">Finance</option>
        <option value="Health">Health</option>
        <option value="Education">Education</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Development">Development</option>
        <option value="Media">Media</option>
        <option value="Government">Government</option>
        <option value="Telecommunications">Telecommunications</option>
      </select>
      <select id="company-type">
        <option value="">All Types</option>
        <option value="Startup">Startup</option>
        <option value="Private Company">Private Company</option>
        <option value="NGO / Non-profit">NGO / Non-profit</option>
        <option value="Government Ministry">Government Ministry</option>
        <option value="International Organization">International Organization</option>
        <option value="University / School">University / School</option>
      </select>
    </div>

    <div class="results-info" id="results-info">
      Showing <strong>12</strong> companies
    </div>

    <div class="companies-grid" id="companies-grid">
      <!-- Rendered by JS -->
    </div>

  </div>

  <!-- ═══ COMPANY MODAL ════════════════════ -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <!-- Rendered by JS -->
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    updateNavbar();

    var allCompanies = COMPANIES.slice();

    function render() {
      var query  = document.getElementById('company-search').value.trim().toLowerCase();
      var sector = document.getElementById('company-sector').value;
      var type   = document.getElementById('company-type').value;

      var filtered = allCompanies.filter(function(c) {
        var matchQ = !query ||
          c.name.toLowerCase().includes(query) ||
          c.description.toLowerCase().includes(query) ||
          c.city.toLowerCase().includes(query);
        var matchS = !sector || c.sector === sector;
        var matchT = !type   || c.type === type;
        return matchQ && matchS && matchT;
      });

      document.getElementById('results-info').innerHTML =
        'Showing <strong>' + filtered.length + '</strong> compan' +
        (filtered.length === 1 ? 'y' : 'ies');

      var grid = document.getElementById('companies-grid');

      if (filtered.length === 0) {
        grid.innerHTML =
          '<div style="text-align:center;padding:60px 20px;color:#888;grid-column:1/-1;">' +
            '<div style="font-size:40px;margin-bottom:12px;">🔍</div>' +
            '<p>No companies found. Try a different search.</p>' +
          '</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(c) {
        var listingCount = c.listings ? c.listings.length : 0;
        return (
          '<div class="company-card" onclick="openModal(\'' + c.id + '\')">' +
            '<div class="company-card-top">' +
              '<div class="company-logo">' + c.short + '</div>' +
              '<div>' +
                '<div class="company-name">' + c.name + '</div>' +
                '<div class="company-type">' + c.type + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="company-desc">' + c.description + '</div>' +
            '<div class="company-meta">' +
              '<span class="company-meta-item">📍 ' + c.city + ', ' + c.region + '</span>' +
              '<span class="company-meta-item">🏢 ' + c.sector + '</span>' +
              '<span class="company-meta-item">👥 ' + c.employees + '</span>' +
            '</div>' +
            '<div class="company-listings-count">' +
              '📋 ' + listingCount + ' active listing' + (listingCount === 1 ? '' : 's') +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function openModal(id) {
      var c = COMPANIES.find(function(x) { return x.id === id; });
      if (!c) return;

      var listings = OPPORTUNITIES.filter(function(o) {
        return c.listings && c.listings.indexOf(o.id) !== -1;
      });

      var listingsHTML = listings.length > 0
        ? listings.map(function(opp) {
            return (
              '<div class="modal-listing-item" ' +
                   'onclick="window.location.href=\'detail.html?id=' + opp.id + '\'">' +
                '<div>' +
                  '<div class="modal-listing-title">' + opp.title + '</div>' +
                  '<div class="modal-listing-meta">' +
                    opp.type + ' · ' + opp.city + ' · ' + opp.salary +
                  '</div>' +
                '</div>' +
                '<span style="color:var(--green-700);font-size:18px;">→</span>' +
              '</div>'
            );
          }).join('')
        : '<p style="font-size:13px;color:#aaa;">No active listings</p>';

      document.getElementById('modal').innerHTML =
        '<div class="modal-header">' +
          '<button class="modal-close" onclick="closeModal()">✕</button>' +
          '<div class="modal-logo">' + c.short + '</div>' +
          '<div class="modal-name">' + c.name + '</div>' +
          '<div class="modal-type">' + c.type + '</div>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="modal-section">' +
            '<div class="modal-section-title">About</div>' +
            '<div class="modal-desc">' + c.description + '</div>' +
          '</div>' +
          '<div class="modal-section">' +
            '<div class="modal-section-title">Details</div>' +
            '<div class="modal-info-grid">' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Location</div>' +
                '<div class="modal-info-value">' + c.city + ', ' + c.region + '</div>' +
              '</div>' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Sector</div>' +
                '<div class="modal-info-value">' + c.sector + '</div>' +
              '</div>' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Founded</div>' +
                '<div class="modal-info-value">' + c.founded + '</div>' +
              '</div>' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Employees</div>' +
                '<div class="modal-info-value">' + c.employees + '</div>' +
              '</div>' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Website</div>' +
                '<div class="modal-info-value">' + c.website + '</div>' +
              '</div>' +
              '<div class="modal-info-item">' +
                '<div class="modal-info-label">Email</div>' +
                '<div class="modal-info-value">' + c.email + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-section">' +
            '<div class="modal-section-title">Active Listings</div>' +
            '<div class="modal-listings">' + listingsHTML + '</div>' +
          '</div>' +
          '<button class="btn-visit" ' +
            'onclick="window.location.href=\'opportunities.html?q=' +
            encodeURIComponent(c.name) + '\'">' +
            'View All Listings →' +
          '</button>' +
        '</div>';

      document.getElementById('modal-overlay').classList.add('visible');
      document.body.style.overflow = 'hidden';
    }

    window.closeModal = function(e) {
      if (e && e.target !== document.getElementById('modal-overlay')) return;
      document.getElementById('modal-overlay').classList.remove('visible');
      document.body.style.overflow = '';
    };

    document.getElementById('company-search').addEventListener('input', render);
    document.getElementById('company-sector').addEventListener('change', render);
    document.getElementById('company-type').addEventListener('change', render);

    render();
  </script>

</body>
</html>
