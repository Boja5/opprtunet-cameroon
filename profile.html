<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — OpportuNet Cameroon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .profile-layout { max-width:1120px; margin:0 auto; padding:40px 28px; display:grid; grid-template-columns:280px 1fr; gap:28px; align-items:start; }
    .profile-sidebar { display:flex; flex-direction:column; gap:16px; position:sticky; top:88px; }
    .profile-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-xl); overflow:hidden; }
    .profile-card-top { background:var(--dark-800); padding:28px; text-align:center; position:relative; }
    .profile-card-top::before { content:''; position:absolute; top:-40px; left:50%; transform:translateX(-50%); width:200px; height:200px; background:radial-gradient(circle, rgba(29,158,117,0.15) 0%, transparent 70%); }
    .profile-avatar { width:72px; height:72px; border-radius:50%; background:var(--green-700); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--white); margin:0 auto 12px; border:3px solid rgba(255,255,255,0.15); }
    .profile-name { font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--white); margin-bottom:4px; }
    .profile-region { font-size:12px; color:var(--green-400); }
    .profile-card-body { padding:16px; }
    .profile-nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-md); font-size:13px; color:#666; cursor:pointer; transition:var(--transition); margin-bottom:2px; }
    .profile-nav-item:hover { background:var(--gray-100); color:var(--dark-900); }
    .profile-nav-item.active { background:var(--green-50); color:var(--green-700); font-weight:500; }
    .profile-completion { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:16px; }
    .completion-title { font-size:12px; font-weight:600; color:var(--dark-900); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .completion-bar { height:6px; background:var(--gray-200); border-radius:3px; overflow:hidden; margin-bottom:6px; }
    .completion-fill { height:100%; background:var(--green-600); border-radius:3px; transition:width 0.5s ease; }
    .completion-label { font-size:12px; color:#888; }
    .profile-panel { display:none; }
    .profile-panel.active { display:block; }
    .p-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-xl); padding:28px; margin-bottom:20px; }
    .p-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .p-card-title { font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--dark-900); }
    .p-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .p-row.single { grid-template-columns:1fr; }
    .p-group { display:flex; flex-direction:column; gap:6px; }
    .p-label { font-size:13px; font-weight:500; color:var(--dark-900); }
    .p-input,.p-select,.p-textarea { padding:10px 14px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-size:14px; font-family:var(--font-body); color:var(--dark-900); background:var(--white); transition:var(--transition); }
    .p-input:focus,.p-select:focus,.p-textarea:focus { outline:none; border-color:var(--green-400); box-shadow:0 0 0 3px rgba(29,158,117,0.08); }
    .p-textarea { resize:vertical; min-height:90px; }
    .p-save-btn { background:var(--green-700); color:var(--white); border:none; padding:10px 24px; border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; transition:var(--transition); font-family:var(--font-body); }
    .p-save-btn:hover { background:var(--green-600); }
    .skills-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .skill-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; background:var(--green-50); color:var(--green-800); border:1px solid var(--green-200); padding:5px 12px; border-radius:20px; }
    .skill-remove { background:none; border:none; color:var(--green-700); cursor:pointer; font-size:14px; padding:0; line-height:1; }
    .skill-remove:hover { color:#e53e3e; }
    .skill-add-row { display:flex; gap:8px; }
    .skill-input { flex:1; padding:9px 14px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-size:13px; font-family:var(--font-body); }
    .skill-input:focus { outline:none; border-color:var(--green-400); }
    .skill-add-btn { background:var(--green-700); color:var(--white); border:none; padding:9px 18px; border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; }
    .skill-add-btn:hover { background:var(--green-600); }
    .edu-item,.exp-item { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--gray-200); }
    .edu-item:last-child,.exp-item:last-child { border-bottom:none; }
    .edu-icon,.exp-icon { width:40px; height:40px; border-radius:var(--radius-md); background:var(--green-50); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .edu-title,.exp-title { font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--dark-900); }
    .edu-sub,.exp-sub { font-size:12px; color:#888; margin-top:2px; }
    .edu-delete,.exp-delete { background:none; border:none; color:#ccc; cursor:pointer; font-size:16px; margin-left:auto; transition:var(--transition); }
    .edu-delete:hover,.exp-delete:hover { color:#e53e3e; }
    .add-item-form { background:var(--gray-100); border-radius:var(--radius-md); padding:16px; margin-top:14px; display:none; }
    .add-item-form.visible { display:block; }
    .add-item-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--green-700); background:none; border:1px dashed var(--green-300); padding:8px 16px; border-radius:var(--radius-md); cursor:pointer; transition:var(--transition); font-family:var(--font-body); }
    .add-item-btn:hover { background:var(--green-50); }
    .cv-preview { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-xl); padding:40px; }
    .cv-header { display:flex; gap:20px; align-items:center; margin-bottom:28px; padding-bottom:24px; border-bottom:2px solid var(--dark-900); }
    .cv-avatar { width:72px; height:72px; border-radius:50%; background:var(--green-700); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--white); flex-shrink:0; }
    .cv-name { font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--dark-900); letter-spacing:-0.5px; }
    .cv-contact { font-size:13px; color:#666; margin-top:4px; }
    .cv-section { margin-bottom:24px; }
    .cv-section-title { font-family:var(--font-display); font-size:13px; font-weight:700; color:var(--dark-900); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--gray-200); }
    .cv-bio { font-size:14px; color:#444; line-height:1.75; }
    .cv-skills-wrap { display:flex; flex-wrap:wrap; gap:6px; }
    .cv-skill { font-size:12px; padding:3px 12px; border-radius:20px; background:var(--green-50); color:var(--green-800); border:1px solid var(--green-200); }
    .cv-edu-item { margin-bottom:12px; }
    .cv-edu-title { font-size:14px; font-weight:600; color:var(--dark-900); }
    .cv-edu-sub { font-size:12px; color:#888; margin-top:2px; }
    .cv-print-btn { background:var(--dark-900); color:var(--white); border:none; padding:11px 24px; border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; transition:var(--transition); font-family:var(--font-body); margin-bottom:20px; }
    .cv-print-btn:hover { background:var(--dark-700); }
    .p-alert { padding:10px 14px; border-radius:var(--radius-md); font-size:13px; margin-bottom:14px; background:var(--green-50); color:var(--green-800); border:1px solid var(--green-200); display:none; }
    .p-alert.visible { display:block; }
    .saved-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--gray-200); cursor:pointer; transition:var(--transition); }
    .saved-item:last-child { border-bottom:none; }
    .saved-item:hover { background:var(--gray-100); padding-left:8px; border-radius:var(--radius-md); }
    .saved-item-title { font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--dark-900); }
    .saved-item-sub { font-size:12px; color:#888; margin-top:2px; }
    @media (max-width:768px) { .profile-layout { grid-template-columns:1fr; } .profile-sidebar { position:static; } .p-row { grid-template-columns:1fr; } .cv-header { flex-direction:column; text-align:center; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">
        <span class="logo-name">OpportuNet</span>
        <span class="logo-country">Cameroon</span>
      </div>
    </a>
    <div class="navbar-links">
      <a href="index.html"         class="nav-link">Home</a>
      <a href="opportunities.html" class="nav-link">Opportunities</a>
      <a href="companies.html"     class="nav-link">Companies</a>
      <a href="people.html"        class="nav-link">People</a>
      <a href="map.html"           class="nav-link">Map</a>
      <a href="about.html"         class="nav-link">About</a>
    </div>
    <div class="navbar-actions" id="navbar-actions"></div>
  </nav>

  <div class="profile-layout">
    <aside class="profile-sidebar">
      <div class="profile-card">
        <div class="profile-card-top">
          <div class="profile-avatar" id="p-avatar">U</div>
          <div class="profile-name"   id="p-name">User</div>
          <div class="profile-region" id="p-region">Cameroon</div>
        </div>
        <div class="profile-card-body">
          <div class="profile-nav-item active" onclick="showProfilePanel('overview')"><span>👤</span> My Profile</div>
          <div class="profile-nav-item" onclick="showProfilePanel('skills')"><span>⚡</span> Skills</div>
          <div class="profile-nav-item" onclick="showProfilePanel('education')"><span>🎓</span> Education</div>
          <div class="profile-nav-item" onclick="showProfilePanel('experience')"><span>💼</span> Experience</div>
          <div class="profile-nav-item" onclick="showProfilePanel('cv')"><span>📄</span> My CV</div>
          <div class="profile-nav-item" onclick="showProfilePanel('saved')"><span>🔖</span> Saved</div>
          <div class="profile-nav-item"
               style="margin-top:8px;border-top:1px solid var(--gray-200);padding-top:10px;"
               onclick="doLogout()"><span>🚪</span> Logout</div>
        </div>
      </div>
      <div class="profile-completion">
        <div class="completion-title">Profile Completion</div>
        <div class="completion-bar">
          <div class="completion-fill" id="completion-fill" style="width:0%"></div>
        </div>
        <div class="completion-label" id="completion-label">0% complete</div>
      </div>
    </aside>

    <main class="profile-main">

      <!-- Overview -->
      <div class="profile-panel active" id="pp-overview">
        <div class="p-card">
          <div class="p-card-header"><div class="p-card-title">Personal Information</div></div>
          <div class="p-alert" id="overview-alert"></div>
          <div class="p-row">
            <div class="p-group"><label class="p-label">Full Name</label><input type="text" class="p-input" id="p-full-name" /></div>
            <div class="p-group"><label class="p-label">Email</label><input type="email" class="p-input" id="p-email" readonly style="background:var(--gray-100);color:#888;" /></div>
          </div>
          <div class="p-row">
            <div class="p-group"><label class="p-label">Region</label><input type="text" class="p-input" id="p-region-input" readonly style="background:var(--gray-100);color:#888;" /></div>
            <div class="p-group"><label class="p-label">Phone</label><input type="text" class="p-input" id="p-phone" placeholder="+237 6XX XXX XXX" /></div>
          </div>
          <div class="p-row single">
            <div class="p-group"><label class="p-label">Bio</label><textarea class="p-textarea" id="p-bio" placeholder="Tell employers about yourself..."></textarea></div>
          </div>
          <button class="p-save-btn" onclick="saveOverview()">Save Changes</button>
        </div>
      </div>

      <!-- Skills -->
      <div class="profile-panel" id="pp-skills">
        <div class="p-card">
          <div class="p-card-header"><div class="p-card-title">My Skills</div></div>
          <div class="skills-wrap" id="skills-wrap"></div>
          <div class="skill-add-row">
            <input type="text" class="skill-input" id="skill-input" placeholder="Add a skill e.g. JavaScript..." />
            <button class="skill-add-btn" onclick="addSkill()">+ Add</button>
          </div>
          <div style="margin-top:16px;"><button class="p-save-btn" onclick="saveSkills()">Save Skills</button></div>
          <div class="p-alert" id="skills-alert" style="margin-top:12px;"></div>
        </div>
      </div>

      <!-- Education -->
      <div class="profile-panel" id="pp-education">
        <div class="p-card">
          <div class="p-card-header"><div class="p-card-title">Education</div></div>
          <div id="edu-list"></div>
          <button class="add-item-btn" onclick="toggleEduForm()">+ Add Education</button>
          <div class="add-item-form" id="edu-form">
            <div class="p-row">
              <div class="p-group"><label class="p-label">Institution</label><input type="text" class="p-input" id="edu-school" placeholder="e.g. University of Yaoundé I" /></div>
              <div class="p-group"><label class="p-label">Degree / Certificate</label><input type="text" class="p-input" id="edu-degree" placeholder="e.g. BSc Computer Science" /></div>
            </div>
            <div class="p-row">
              <div class="p-group"><label class="p-label">Year</label><input type="text" class="p-input" id="edu-year" placeholder="e.g. 2020 – 2024" /></div>
              <div class="p-group"><label class="p-label">Grade</label><input type="text" class="p-input" id="edu-grade" placeholder="e.g. First Class" /></div>
            </div>
            <button class="p-save-btn" onclick="addEducation()">Add</button>
          </div>
          <div class="p-alert" id="edu-alert" style="margin-top:12px;"></div>
        </div>
      </div>

      <!-- Experience -->
      <div class="profile-panel" id="pp-experience">
        <div class="p-card">
          <div class="p-card-header"><div class="p-card-title">Work Experience</div></div>
          <div id="exp-list"></div>
          <button class="add-item-btn" onclick="toggleExpForm()">+ Add Experience</button>
          <div class="add-item-form" id="exp-form">
            <div class="p-row">
              <div class="p-group"><label class="p-label">Job Title</label><input type="text" class="p-input" id="exp-title" placeholder="e.g. Web Developer Intern" /></div>
              <div class="p-group"><label class="p-label">Company</label><input type="text" class="p-input" id="exp-company" placeholder="e.g. Orange Cameroun" /></div>
            </div>
            <div class="p-row">
              <div class="p-group"><label class="p-label">Period</label><input type="text" class="p-input" id="exp-period" placeholder="e.g. Jan 2023 – Jun 2023" /></div>
              <div class="p-group"><label class="p-label">Location</label><input type="text" class="p-input" id="exp-location" placeholder="e.g. Douala" /></div>
            </div>
            <div class="p-row single">
              <div class="p-group"><label class="p-label">Description</label><textarea class="p-textarea" id="exp-desc" style="min-height:70px;" placeholder="What did you do?"></textarea></div>
            </div>
            <button class="p-save-btn" onclick="addExperience()">Add</button>
          </div>
          <div class="p-alert" id="exp-alert" style="margin-top:12px;"></div>
        </div>
      </div>

      <!-- CV -->
      <div class="profile-panel" id="pp-cv">
        <button class="cv-print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
        <div class="cv-preview" id="cv-preview"></div>
      </div>

      <!-- Saved -->
      <div class="profile-panel" id="pp-saved">
        <div class="p-card">
          <div class="p-card-header"><div class="p-card-title">Saved Opportunities</div></div>
          <div id="saved-list"></div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/data.js"></script>
  <script type="module">
    import { FirebaseAuth, updateNavbar } from './js/firebase.js';

    var currentUser = null;
    var tempSkills  = [];

    window.doLogout = function() { FirebaseAuth.logout(); };

    window.addEventListener('load', function() {
      currentUser = FirebaseAuth.requireYouth();
      if (!currentUser) return;
      updateNavbar();
      loadSidebarInfo();
      loadOverviewForm();
      loadSkills();
      loadEducation();
      loadExperience();
      updateCompletion();
    });

    function loadSidebarInfo() {
      document.getElementById('p-avatar').textContent  = currentUser.name.charAt(0).toUpperCase();
      document.getElementById('p-name').textContent    = currentUser.name;
      document.getElementById('p-region').textContent  = currentUser.region || 'Cameroon';
    }

    window.showProfilePanel = function(name) {
      document.querySelectorAll('.profile-panel').forEach(function(p) { p.classList.remove('active'); });
      document.querySelectorAll('.profile-nav-item').forEach(function(n) { n.classList.remove('active'); });
      document.getElementById('pp-' + name).classList.add('active');
      var navMap = { 'overview':0,'skills':1,'education':2,'experience':3,'cv':4,'saved':5 };
      var items  = document.querySelectorAll('.profile-nav-item');
      if (items[navMap[name]] !== undefined) items[navMap[name]].classList.add('active');
      if (name === 'cv')    renderCV();
      if (name === 'saved') renderSaved();
    };

    function updateCompletion() {
      var score = 0;
      if (currentUser.name) score += 20;
      if (currentUser.bio && currentUser.bio.length > 10) score += 20;
      if (currentUser.skills && currentUser.skills.length > 0) score += 20;
      if (currentUser.education && currentUser.education.length > 0) score += 20;
      if (currentUser.experience && currentUser.experience.length > 0) score += 20;
      document.getElementById('completion-fill').style.width = score + '%';
      document.getElementById('completion-label').textContent = score + '% complete';
    }

    function loadOverviewForm() {
      document.getElementById('p-full-name').value    = currentUser.name    || '';
      document.getElementById('p-email').value        = currentUser.email   || '';
      document.getElementById('p-region-input').value = currentUser.region  || '';
      document.getElementById('p-phone').value        = currentUser.phone   || '';
      document.getElementById('p-bio').value          = currentUser.bio     || '';
    }

    window.saveOverview = async function() {
      var updated = {
        name:  document.getElementById('p-full-name').value.trim(),
        phone: document.getElementById('p-phone').value.trim(),
        bio:   document.getElementById('p-bio').value.trim()
      };
      var result = await FirebaseAuth.updateUser(updated);
      if (result.success) {
        currentUser = result.user;
        loadSidebarInfo();
        updateCompletion();
        showAlert('overview-alert', 'Profile saved successfully!');
      }
    };

    function loadSkills() {
      tempSkills = (currentUser.skills || []).slice();
      renderSkillTags();
    }

    function renderSkillTags() {
      var wrap = document.getElementById('skills-wrap');
      if (!wrap) return;
      if (tempSkills.length === 0) {
        wrap.innerHTML = '<p style="font-size:13px;color:#aaa;margin-bottom:12px;">No skills added yet.</p>';
        return;
      }
      wrap.innerHTML = tempSkills.map(function(skill, i) {
        return '<span class="skill-tag">' + skill +
          '<button class="skill-remove" onclick="removeSkill(' + i + ')">×</button></span>';
      }).join('');
    }

    window.addSkill = function() {
      var input = document.getElementById('skill-input');
      var val   = input.value.trim();
      if (!val) return;
      if (tempSkills.indexOf(val) === -1) { tempSkills.push(val); renderSkillTags(); }
      input.value = '';
    };

    window.removeSkill = function(i) { tempSkills.splice(i, 1); renderSkillTags(); };

    window.saveSkills = async function() {
      var result = await FirebaseAuth.updateUser({ skills: tempSkills.slice() });
      if (result.success) {
        currentUser = result.user;
        updateCompletion();
        showAlert('skills-alert', 'Skills saved successfully!');
      }
    };

    document.getElementById('skill-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); window.addSkill(); }
    });

    function loadEducation() { renderEducation(); }

    function renderEducation() {
      var list = document.getElementById('edu-list');
      var edu  = currentUser.education || [];
      if (edu.length === 0) {
        list.innerHTML = '<p style="font-size:13px;color:#aaa;margin-bottom:12px;">No education added yet.</p>';
        return;
      }
      list.innerHTML = edu.map(function(e, i) {
        return '<div class="edu-item"><div class="edu-icon">🎓</div>' +
          '<div style="flex:1;"><div class="edu-title">' + e.degree + '</div>' +
          '<div class="edu-sub">' + e.school + ' · ' + e.year + '</div>' +
          (e.grade ? '<div class="edu-sub">' + e.grade + '</div>' : '') + '</div>' +
          '<button class="edu-delete" onclick="deleteEducation(' + i + ')">🗑</button></div>';
      }).join('');
    }

    window.toggleEduForm = function() {
      document.getElementById('edu-form').classList.toggle('visible');
    };

    window.addEducation = async function() {
      var school = document.getElementById('edu-school').value.trim();
      var degree = document.getElementById('edu-degree').value.trim();
      var year   = document.getElementById('edu-year').value.trim();
      var grade  = document.getElementById('edu-grade').value.trim();
      if (!school || !degree) { showAlert('edu-alert', 'Please fill in institution and degree.', true); return; }
      var edu = (currentUser.education || []).slice();
      edu.push({ school: school, degree: degree, year: year, grade: grade });
      var result = await FirebaseAuth.updateUser({ education: edu });
      if (result.success) {
        currentUser = result.user;
        document.getElementById('edu-school').value = '';
        document.getElementById('edu-degree').value = '';
        document.getElementById('edu-year').value   = '';
        document.getElementById('edu-grade').value  = '';
        document.getElementById('edu-form').classList.remove('visible');
        renderEducation();
        updateCompletion();
        showAlert('edu-alert', 'Education added!');
      }
    };

    window.deleteEducation = async function(i) {
      var edu = (currentUser.education || []).slice();
      edu.splice(i, 1);
      var result = await FirebaseAuth.updateUser({ education: edu });
      if (result.success) { currentUser = result.user; renderEducation(); updateCompletion(); }
    };

    function loadExperience() { renderExperience(); }

    function renderExperience() {
      var list = document.getElementById('exp-list');
      var exp  = currentUser.experience || [];
      if (exp.length === 0) {
        list.innerHTML = '<p style="font-size:13px;color:#aaa;margin-bottom:12px;">No experience added yet.</p>';
        return;
      }
      list.innerHTML = exp.map(function(e, i) {
        return '<div class="exp-item"><div class="exp-icon">💼</div>' +
          '<div style="flex:1;"><div class="exp-title">' + e.title + '</div>' +
          '<div class="exp-sub">' + e.company + ' · ' + (e.location || '') + '</div>' +
          '<div class="exp-sub">' + (e.period || '') + '</div>' +
          (e.desc ? '<div style="font-size:12px;color:#555;margin-top:4px;line-height:1.6;">' + e.desc + '</div>' : '') +
          '</div><button class="exp-delete" onclick="deleteExperience(' + i + ')">🗑</button></div>';
      }).join('');
    }

    window.toggleExpForm = function() {
      document.getElementById('exp-form').classList.toggle('visible');
    };

    window.addExperience = async function() {
      var title    = document.getElementById('exp-title').value.trim();
      var company  = document.getElementById('exp-company').value.trim();
      var period   = document.getElementById('exp-period').value.trim();
      var location = document.getElementById('exp-location').value.trim();
      var desc     = document.getElementById('exp-desc').value.trim();
      if (!title || !company) { showAlert('exp-alert', 'Please fill in job title and company.', true); return; }
      var exp = (currentUser.experience || []).slice();
      exp.push({ title: title, company: company, period: period, location: location, desc: desc });
      var result = await FirebaseAuth.updateUser({ experience: exp });
      if (result.success) {
        currentUser = result.user;
        document.getElementById('exp-title').value    = '';
        document.getElementById('exp-company').value  = '';
        document.getElementById('exp-period').value   = '';
        document.getElementById('exp-location').value = '';
        document.getElementById('exp-desc').value     = '';
        document.getElementById('exp-form').classList.remove('visible');
        renderExperience();
        updateCompletion();
        showAlert('exp-alert', 'Experience added!');
      }
    };

    window.deleteExperience = async function(i) {
      var exp = (currentUser.experience || []).slice();
      exp.splice(i, 1);
      var result = await FirebaseAuth.updateUser({ experience: exp });
      if (result.success) { currentUser = result.user; renderExperience(); updateCompletion(); }
    };

    // ─── Saved opportunities ──────────────
    function renderSaved() {
      var list     = document.getElementById('saved-list');
      var savedIds = localStorage.getItem('opportunet_saved');
      savedIds     = savedIds ? JSON.parse(savedIds) : [];

      if (savedIds.length === 0) {
        list.innerHTML =
          '<div style="text-align:center;padding:40px 20px;color:#aaa;">' +
            '<div style="font-size:36px;margin-bottom:10px;">🔖</div>' +
            '<p style="font-size:13px;">No saved opportunities yet.<br>' +
            'Click the ♡ on any listing to save it here.</p>' +
          '</div>';
        return;
      }

      var saved = OPPORTUNITIES.filter(function(o) {
        return savedIds.indexOf(o.id) !== -1;
      });

      if (saved.length === 0) {
        list.innerHTML =
          '<div style="text-align:center;padding:40px 20px;color:#aaa;">' +
            '<div style="font-size:36px;margin-bottom:10px;">🔖</div>' +
            '<p style="font-size:13px;">No saved opportunities yet.</p>' +
          '</div>';
        return;
      }

      list.innerHTML = saved.map(function(opp) {
        return (
          '<div class="saved-item" onclick="window.location.href=\'detail.html?id=' + opp.id + '\'">' +
            '<div>' +
              '<div class="saved-item-title">' + opp.title + '</div>' +
              '<div class="saved-item-sub">' +
                opp.organization + ' · ' + opp.city + ' · ' + opp.deadline +
              '</div>' +
            '</div>' +
            '<span style="font-size:18px;color:var(--green-700);">→</span>' +
          '</div>'
        );
      }).join('');
    }

    // ─── CV ───────────────────────────────
    function renderCV() {
      var user = FirebaseAuth.getCurrentUser();
      var cv   = document.getElementById('cv-preview');
      if (!cv || !user) return;

      var skillsHTML = (user.skills && user.skills.length > 0)
        ? '<div class="cv-skills-wrap">' +
            user.skills.map(function(s) {
              return '<span class="cv-skill">' + s + '</span>';
            }).join('') +
          '</div>'
        : '<p style="font-size:13px;color:#aaa;">No skills added yet.</p>';

      var eduHTML = (user.education && user.education.length > 0)
        ? user.education.map(function(e) {
            return '<div class="cv-edu-item">' +
              '<div class="cv-edu-title">' + e.degree + '</div>' +
              '<div class="cv-edu-sub">' + e.school +
                (e.year  ? ' · ' + e.year  : '') +
                (e.grade ? ' · ' + e.grade : '') +
              '</div></div>';
          }).join('')
        : '<p style="font-size:13px;color:#aaa;">No education added yet.</p>';

      var expHTML = (user.experience && user.experience.length > 0)
        ? user.experience.map(function(e) {
            return '<div class="cv-edu-item">' +
              '<div class="cv-edu-title">' + e.title + ' — ' + e.company + '</div>' +
              '<div class="cv-edu-sub">' +
                (e.period   ? e.period + ' · '   : '') +
                (e.location ? e.location : '') +
              '</div>' +
              (e.desc
                ? '<div style="font-size:13px;color:#555;margin-top:4px;line-height:1.65;">' +
                    e.desc + '</div>'
                : '') +
            '</div>';
          }).join('')
        : '<p style="font-size:13px;color:#aaa;">No experience added yet.</p>';

      cv.innerHTML =
        '<div class="cv-header">' +
          '<div class="cv-avatar">' + user.name.charAt(0).toUpperCase() + '</div>' +
          '<div>' +
            '<div class="cv-name">' + user.name + '</div>' +
            '<div class="cv-contact">' + user.email +
              (user.phone  ? ' · ' + user.phone  : '') +
              (user.region ? ' · ' + user.region : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        (user.bio
          ? '<div class="cv-section"><div class="cv-section-title">Profile</div>' +
            '<div class="cv-bio">' + user.bio + '</div></div>'
          : '') +
        '<div class="cv-section"><div class="cv-section-title">Skills</div>'     + skillsHTML + '</div>' +
        '<div class="cv-section"><div class="cv-section-title">Education</div>'  + eduHTML    + '</div>' +
        '<div class="cv-section"><div class="cv-section-title">Experience</div>' + expHTML    + '</div>';
    }

    // ─── Alert helper ─────────────────────
    function showAlert(id, message, isError) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent       = message;
      el.className         = 'p-alert visible';
      el.style.background  = isError ? '#FEF0F0' : '';
      el.style.color       = isError ? '#8a1a1a' : '';
      el.style.borderColor = isError ? '#f5c6c6' : '';
      setTimeout(function() { el.classList.remove('visible'); }, 2500);
    }
  </script>

</body>
</html>
