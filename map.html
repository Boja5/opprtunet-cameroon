<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map — OpportuNet Cameroon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header { background:var(--dark-800); padding:40px 28px 32px; border-bottom:1px solid var(--dark-700); }
    .page-header-inner { max-width:1120px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; }
    .page-header h1 { font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--white); letter-spacing:-0.5px; margin-bottom:4px; }
    .page-header p { font-size:14px; color:rgba(255,255,255,0.45); font-weight:300; }
    .map-type-tabs { display:flex; gap:8px; }
    .map-type-tab { font-size:13px; padding:8px 18px; border-radius:var(--radius-md); border:1px solid rgba(255,255,255,0.15); background:transparent; color:rgba(255,255,255,0.6); cursor:pointer; transition:var(--transition); }
    .map-type-tab.active { background:var(--green-700); border-color:var(--green-700); color:var(--white); }
    .map-type-tab:hover:not(.active) { border-color:rgba(255,255,255,0.3); color:var(--white); }
    .map-layout { display:grid; grid-template-columns:320px 1fr; height:calc(100vh - 160px); min-height:500px; }
    .map-panel { background:var(--white); border-right:1px solid var(--gray-200); display:flex; flex-direction:column; overflow:hidden; }
    .map-panel-search { padding:16px; border-bottom:1px solid var(--gray-200); }
    .map-panel-search input { width:100%; padding:9px 14px; border:1px solid var(--gray-200); border-radius:var(--radius-md); font-size:13px; color:var(--dark-900); background:var(--gray-100); }
    .map-panel-search input:focus { outline:none; border-color:var(--green-400); background:var(--white); }
    .map-panel-filters { padding:12px 16px; border-bottom:1px solid var(--gray-200); display:flex; gap:6px; flex-wrap:wrap; }
    .map-filter-chip { font-size:11px; padding:4px 12px; border-radius:20px; border:1px solid var(--gray-200); background:var(--white); color:#666; cursor:pointer; transition:var(--transition); }
    .map-filter-chip.active { background:var(--green-700); border-color:var(--green-700); color:var(--white); }
    .map-panel-header { padding:12px 16px 8px; font-size:12px; color:#888; font-weight:500; text-transform:uppercase; letter-spacing:0.05em; }
    .map-panel-list { flex:1; overflow-y:auto; padding:0 8px 16px; }
    .map-panel-list::-webkit-scrollbar { width:4px; }
    .map-panel-list::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:4px; }
    #map { width:100%; height:100%; z-index:1; }
    .region-stats { background:var(--dark-900); padding:16px 28px; overflow-x:auto; }
    .region-stats-inner { max-width:1120px; margin:0 auto; display:flex; gap:8px; min-width:max-content; }
    .region-stat-pill { display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:20px; border:1px solid rgba(255,255,255,0.08); background:var(--dark-800); cursor:pointer; transition:var(--transition); white-space:nowrap; }
    .region-stat-pill:hover { border-color:rgba(29,158,117,0.4); }
    .region-stat-pill.active { background:rgba(29,158,117,0.15); border-color:rgba(29,158,117,0.5); }
    .region-stat-name { font-size:12px; color:rgba(255,255,255,0.65); }
    .region-stat-count { font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--green-400); }
    .leaflet-popup-content-wrapper { border-radius:12px !important; box-shadow:0 8px 32px rgba(0,0,0,0.15) !important; border:1px solid var(--gray-200); padding:0 !important; overflow:hidden; }
    .leaflet-popup-content { margin:0 !important; width:240px !important; }
    .leaflet-popup-tip-container { display:none; }
    .map-popup { padding:16px; }
    .map-popup-region { font-size:11px; color:var(--green-700); font-weight:500; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
    .map-popup-count { font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--dark-900); margin-bottom:2px; }
    .map-popup-label { font-size:12px; color:#888; margin-bottom:14px; }
    .map-popup-btn { display:block; width:100%; text-align:center; background:var(--green-700); color:var(--white); font-size:13px; font-weight:500; padding:9px; border-radius:var(--radius-md); border:none; cursor:pointer; text-decoration:none; }
    .map-popup-btn:hover { background:var(--green-600); }
    .empty-panel { text-align:center; padding:40px 20px; color:#aaa; }
    .empty-panel-icon { font-size:32px; margin-bottom:10px; }
    .empty-panel p { font-size:13px; }
    @media (max-width:768px) { .map-layout { grid-template-columns:1fr; height:auto; } .map-panel { height:300px; border-right:none; border-bottom:1px solid var(--gray-200); } #map { height:400px; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">
        <span class="logo-name">OpportuNet</span>
        <span class="logo-country">Cameroon</span>
      </div>
    </a>
    <div class="navbar-links">
      <a href="index.html"         class="nav-link">Home</a>
      <a href="opportunities.html" class="nav-link">Opportunities</a>
      <a href="companies.html"     class="nav-link">Companies</a>
      <a href="people.html"        class="nav-link">People</a>
      <a href="map.html"           class="nav-link active">Map</a>
      <a href="about.html"         class="nav-link">About</a>
    </div>
    <div class="navbar-actions" id="navbar-actions"></div>
  </nav>

  <div class="page-header">
    <div class="page-header-inner">
      <div>
        <h1>Opportunities Map</h1>
        <p>Explore opportunities by location across all 10 regions of Cameroon</p>
      </div>
      <div class="map-type-tabs">
        <button class="map-type-tab active" onclick="setFilter('all', this)">All</button>
        <button class="map-type-tab" onclick="setFilter('job', this)">Jobs</button>
        <button class="map-type-tab" onclick="setFilter('internship', this)">Internships</button>
        <button class="map-type-tab" onclick="setFilter('training', this)">Training</button>
        <button class="map-type-tab" onclick="setFilter('grant', this)">Grants</button>
      </div>
    </div>
  </div>

  <div class="region-stats">
    <div class="region-stats-inner" id="region-stats-inner"></div>
  </div>

  <div class="map-layout">
    <div class="map-panel">
      <div class="map-panel-search">
        <input type="text" id="map-search" placeholder="🔍  Search opportunities..." />
      </div>
      <div class="map-panel-filters">
        <button class="map-filter-chip active" data-filter="all">All</button>
        <button class="map-filter-chip" data-filter="job">Jobs</button>
        <button class="map-filter-chip" data-filter="internship">Internships</button>
        <button class="map-filter-chip" data-filter="training">Training</button>
        <button class="map-filter-chip" data-filter="grant">Grants</button>
      </div>
      <div class="map-panel-header" id="panel-header">All opportunities</div>
      <div class="map-panel-list" id="map-panel-list"></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script>updateNavbar();</script>

</body>
</html>
